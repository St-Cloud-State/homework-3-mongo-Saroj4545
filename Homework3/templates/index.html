<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acme Financial Corp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-center mb-5">Welcome to Acme Financial Corp</h1>

    <!-- Submit Application -->
    <div class="card mb-4">
        <div class="card-header">Loan Application</div>
        <div class="card-body">
            <div class="mb-3">
                <label for="name" class="form-label">Applicant Name:</label>
                <input type="text" id="name" class="form-control" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address:</label>
                <input type="text" id="address" class="form-control" placeholder="Enter your address">
            </div>
            <div class="mb-3">
                <label for="zipcode" class="form-label">Zipcode:</label>
                <input type="number" id="zipcode" class="form-control" placeholder="Enter your zipcode">
            </div>
            <button onclick="submitApplication()" class="btn btn-primary">Submit Application</button>
            <p id="applicationResponse" class="mt-3"></p>
        </div>
    </div>

    <!-- Check Application Status -->
    <div class="card mb-4">
        <div class="card-header">Check Application Status</div>
        <div class="card-body">
            <div class="mb-3">
                <label for="statusAppId" class="form-label">Application ID:</label>
                <input type="text" id="statusAppId" class="form-control" placeholder="Enter application ID">
            </div>
            <button onclick="checkStatus()" class="btn btn-info">Check Status</button>
            <p id="statusResponse" class="mt-3"></p>
        </div>
    </div>

    <!-- Unified Status Update -->
    <div class="card mb-4">
        <div class="card-header">Update Application Status</div>
        <div class="card-body">
            <div class="mb-3">
                <label for="updateAppId" class="form-label">Application ID:</label>
                <input type="text" id="updateAppId" class="form-control" placeholder="Enter application ID">
            </div>
            <div class="mb-3">
                <label for="newStatus" class="form-label">New Status:</label>
                <select id="newStatus" class="form-select" onchange="toggleStatusFields()">
                    <option value="" disabled selected>Select a status</option>
                    <option value="received">Received</option>
                    <option value="processing">Processing</option>
                    <option value="accepted">Accepted</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
            <div id="subphaseFields" style="display: none;">
                <div class="mb-3">
                    <label for="subphaseName" class="form-label">Subphase Name:</label>
                    <input type="text" id="subphaseName" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="subphaseMessage" class="form-label">Subphase Message:</label>
                    <input type="text" id="subphaseMessage" class="form-control">
                </div>
            </div>
            <div id="loanTermField" style="display: none;">
                <div class="mb-3">
                    <label for="loanTermText" class="form-label">Loan Term:</label>
                    <input type="text" id="loanTermText" class="form-control">
                </div>
            </div>
            <div id="rejectionReasonField" style="display: none;">
                <div class="mb-3">
                    <label for="rejectionReason" class="form-label">Rejection Reason:</label>
                    <input type="text" id="rejectionReason" class="form-control">
                </div>
            </div>
            <button onclick="handleStatusUpdate()" class="btn btn-warning">Update Status</button>
            <p id="updateResponse" class="mt-3"></p>
        </div>
    </div>

    <!-- Add Note -->
    <div class="card mb-4">
        <div class="card-header">Add a Note to Application</div>
        <div class="card-body">
            <div class="mb-3">
                <label for="noteAppId" class="form-label">Application ID:</label>
                <input type="text" id="noteAppId" class="form-control">
            </div>
            <div class="mb-3">
                <label for="noteText" class="form-label">Note:</label>
                <input type="text" id="noteText" class="form-control">
            </div>
            <button onclick="addNote()" class="btn btn-success">Add Note</button>
            <p id="noteResponse" class="mt-3"></p>
        </div>
    </div>

    <!-- View Notes -->
    <div class="card mb-4">
        <div class="card-header">View Application Notes</div>
        <div class="card-body">
            <div class="mb-3">
                <label for="viewNotesAppId" class="form-label">Application ID:</label>
                <input type="text" id="viewNotesAppId" class="form-control">
            </div>
            <button onclick="viewNotes()" class="btn btn-secondary">View Notes</button>
            <div id="notesList" class="mt-3"></div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
